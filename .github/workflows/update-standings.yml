name: Update WSS Standings

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-standings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright and Chromium
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Fetch finished events and Top 3 podiums
        env:
          WSS_EMAIL: ${{ secrets.WSS_EMAIL }}
          WSS_PASSWORD: ${{ secrets.WSS_PASSWORD }}
        run: python scripts/update_standings.py

      - name: Commit updated standings.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/standings.json
          git diff --cached --quiet || git commit -m "chore: update WSS finished event standings"
          git push
