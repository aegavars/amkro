media:
  input: assets/blog
  output: assets/blog

content:
  - name: blog
    label: Blog & Race Reports
    type: file
    path: data/blog.json
    format: json
    fields:
      - name: posts
        label: Posts
        type: object
        list: true
        fields:
          - name: title
            label: Headline
            type: string
            required: true
          - name: date
            label: Publish Date
            type: date
            required: true
          - name: author
            label: Author
            type: string
            default: AMKRO Media
          - name: category
            label: Tag / Category
            type: string
            default: RACE REPORT
          - name: image
            label: Cover Image
            type: image
          - name: excerpt
            label: Short Summary
            type: text
            required: true
          - name: body
            label: Full Article
            type: rich-text
            required: true
