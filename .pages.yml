media:
  input: images/blog
  output: /images/blog

content:
  - name: posts
    label: Blog Posts
    path: posts
    type: collection
    view:
      fields: [title, category, date, author]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Article Title
        type: string
        required: true
      - name: category
        label: Category
        type: select
        options:
          values:
            - Race Report
            - Championship News
            - Team Announcement
            - Technical / Rules
            - Newspaper
        default: Race Report
      - name: date
        label: Publish Date
        type: date
        required: true
      - name: author
        label: Author
        type: string
        default: AMKRO Media
      - name: image
        label: Cover Banner Image
        type: image
      - name: excerpt
        label: Short Summary (Shown on Card)
        type: text
      - name: body
        label: Full Article Content
        type: rich-text
        options:
          toolbar:
            - heading
            - bold
            - italic
            - underline
            - strike
            - blockquote
            - bulleted-list
            - numbered-list
            - table
            - image
            - link
            - code
            - code-block
            - horizontal-rule
