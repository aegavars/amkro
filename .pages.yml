media:
  input: assets/blog
  output: /assets/blog
  categories: [image]

content:
  - name: posts
    label: Blog & Race Reports
    path: posts
    type: collection
    view:
      fields: [title, category, date, author]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: category
        label: Category
        type: select
        options:
          values:
            - RACE REPORT
            - CHAMPIONSHIP NEWS
            - ANNOUNCEMENT
            - DRIVER INTERVIEW
            - NEWSPAPER
        default: RACE REPORT
      - name: date
        label: Publish Date
        type: date
        required: true
      - name: author
        label: Author
        type: string
        default: AMKRO Media
      - name: image
        label: Cover Banner Image
        type: image
      - name: excerpt
        label: Short Summary (Shown on Blog Card)
        type: text
        required: true
      - name: body
        label: Article Content (Insert Tables, Images & Quotes Anywhere)
        type: rich-text
        required: true
        options:
          format: html
          toolbar:
            - heading
            - bold
            - italic
            - underline
            - strike
            - blockquote
            - bulleted-list
            - numbered-list
            - table
            - image
            - link
            - horizontal-rule
            - align
            - code-block
            - undo
            - redo
